service: custom-authorizer

provider:
  name: aws
  runtime: python3.9
  region: ap-southeast-1
  environment:
    POWERTOOLS_LOG_LEVEL: DEBUG
  iam:
    role: arn:aws:iam::306396860374:role/lambda-api-config-dev-lambdaRole

plugins:
  - serverless-python-requirements
  - serverless-ssm-fetch

custom:
  pythonRequirements:
    dockerizePip: false        # use docker to build deps for correct OS/arch
    layer: true              # or true if you want dependencies in a Lambda layer
    slim: true                # reduce package size
    strip: false
  serverlessSsmFetch:
    ALLOWED_CNAMES: "/lambda-api-config/allowed-cnames~true"

functions:
  authorizer:
    handler: authorizer.handler.authorize
    # provisionedConcurrency: 1
    # concurrencyAutoscaling:
    #   enabled: true
    #   alias: provisioned
    #   maximum: 10
    #   minimum: 1
    #   usage: 0.75
    #   scaleInCooldown: 0
    #   scaleOutCooldown: 0
    layers:
      - Ref: PythonRequirementsLambdaLayer
    ssmToEnvironment:
      - ALLOWED_CNAMES
